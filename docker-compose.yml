services:
  backend:
    build:
      context: ./backend
    container_name: ${BACKEND_CONTAINER_NAME:-effective-mobile-backend}
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 128m
    pids_limit: 64
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    expose:
      - "${APP_PORT:-8080}"
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8080}
      APP_RESPONSE_FILE: ${APP_RESPONSE_FILE:-/run/secrets/backend_response.txt}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - effective-mobile-network

  nginx:
    image: nginx:1.27-alpine
    container_name: ${NGINX_CONTAINER_NAME:-effective-mobile-nginx}
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 128m
    pids_limit: 128
    ulimits:
      nofile:
        soft: 2048
        hard: 4096
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    networks:
      - effective-mobile-network

networks:
  effective-mobile-network:
